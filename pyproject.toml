[project]
name = "voxpulse-voice-attribute-service"
version = "0.1.0"
description = "VoxPulse Voice Attribute Inference Service - Real-time Gender, Age & Audio Quality Prediction"
readme = "README.md"
authors = [
    { name = "VoxPulse Engineering Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "speechbrain>=1.0.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "websockets>=12.0",
    "imageio-ffmpeg>=0.4.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pyarrow>=25.0.1",
    "datasets>=5.0.1",
    "scikit-learn>=1.9.0",
    "transformers>=5.16.1",
    "opensmile>=2.6.0",
    "lightgbm>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
